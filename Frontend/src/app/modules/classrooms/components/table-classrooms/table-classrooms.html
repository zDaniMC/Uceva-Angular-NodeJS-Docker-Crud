<div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">

        <thead class="table-light">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Código</th>
                <th scope="col">Edificio</th>
                <th scope="col">Capacidad</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-center">Opciones</th>
            </tr>
        </thead>

        <tbody>
            @for (classroom of classrooms; track classroom.id) {
                <tr>
                    <td>{{ classroom.id }}</td>

                    <td class="fw-semibold">{{ classroom.code }}</td>

                    <td>{{ classroom.building }}</td>

                    <td><span class="badge text-bg-info">{{ classroom.capacity }} personas</span></td>

                    <td>
                        @if (classroom.status) {
                            <span class="badge text-bg-success">
                                Activo
                            </span>
                        } @else {
                            <span class="badge text-bg-danger">
                                Inactivo
                            </span>
                        }
                    </td>

                    <!-- Options -->
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <app-button [config]="configDetailButton" (onClick)="click(classroom.id, 'detail')" />
                            <app-button [config]="configEditButton" (onClick)="click(classroom.id, 'edit')" />
                            <app-button [config]="configDeleteButton" (onClick)="click(classroom.id, 'delete')" />
                        </div>
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="9" class="text-center py-4 text-muted">
                        No hay aulas registradas.
                    </td>
                </tr>
            }
        </tbody>

    </table>
</div>
